name: Update Game Results

on:
  schedule:
    # Thursday evening
    - cron: "*/15 23 * * 4"

    # Friday early morning / Friday football
    - cron: "*/15 0-5 * * 5"
    - cron: "*/15 16-23 * * 5"

    # Saturday
    - cron: "*/15 0-5 * * 6"
    - cron: "*/15 16-23 * * 6"

    # Sunday
    - cron: "*/15 0-5 * * 0"
    - cron: "*/15 16-23 * * 0"

    # Monday
    - cron: "*/15 0-5 * * 1"
    - cron: "*/15 16-23 * * 1"

    # Tuesday early morning for Monday night games
    - cron: "*/15 0-5 * * 2"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-games:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install PBJ
        run: python -m pip install .

      - name: Determine current week
        id: week
        shell: bash
        run: |
          season=2026

          current_week=$(
            find "data/$season" \
              -maxdepth 1 \
              -type f \
              -name 'week[0-9][0-9].json' \
              -printf '%f\n' |
            sort |
            tail -n 1 |
            sed -E 's/week([0-9]{2})\.json/\1/'
          )

          if [[ -z "$current_week" ]]; then
            echo "No weekly schedule exists."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          week=$((10#$current_week))

          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "week_padded=$current_week" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Check polling window
        id: poll
        if: steps.week.outputs.found == 'true'
        shell: bash
        run: |
          if python scripts/should_poll.py \
            "${{ steps.week.outputs.season }}" \
            "${{ steps.week.outputs.week }}"; then

            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No relevant games right now."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update games
        if: steps.poll.outputs.run == 'true'
        run: |
          python scripts/update_games.py \
            "${{ steps.week.outputs.season }}" \
            "${{ steps.week.outputs.week }}"

      - name: Commit game updates
        if: steps.poll.outputs.run == 'true'
        shell: bash
        run: |
          week_file="data/${{ steps.week.outputs.season }}/week${{ steps.week.outputs.week_padded }}.json"

          if git diff --quiet -- "$week_file"; then
            echo "No game changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$week_file"

          git commit \
            -m "Update week ${{ steps.week.outputs.week }} games"

      - name: Score week
        if: steps.poll.outputs.run == 'true'
        run: |
          python scripts/score_week.py \
            "${{ steps.week.outputs.season }}" \
            "${{ steps.week.outputs.week }}"

      - name: Commit scoring updates
        if: steps.poll.outputs.run == 'true'
        shell: bash
        run: |
          week_file="data/${{ steps.week.outputs.season }}/week${{ steps.week.outputs.week_padded }}.json"

          if git diff --quiet -- "$week_file"; then
            echo "No scoring changes to commit."
            exit 0
          fi

          git add "$week_file"

          git commit \
            -m "Score week ${{ steps.week.outputs.week }}"

      - name: Aggregate season
        if: steps.poll.outputs.run == 'true'
        run: |
          python scripts/aggregate_season.py \
            "${{ steps.week.outputs.season }}"

      - name: Commit season updates
        if: steps.poll.outputs.run == 'true'
        shell: bash
        run: |
          season_file="data/${{ steps.week.outputs.season }}/season.json"

          if git diff --quiet -- "$season_file"; then
            echo "No season changes to commit."
            exit 0
          fi

          git add "$season_file"

          git commit \
            -m "Update ${{ steps.week.outputs.season }} season standings"

      - name: Push updates
        if: steps.poll.outputs.run == 'true'
        run: |
          if git status --porcelain | grep -q .; then
            echo "Uncommitted changes remain:"
            git status --short
            exit 1
          fi

          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/${{ github.ref_name }})" ]]; then
            git push
          else
            echo "No commits to push."
          fi