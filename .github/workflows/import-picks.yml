name: Import Weekly Picks

on:
  push:
    paths:
      - "data/2026/week*.csv"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-picks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PBJ
        run: python -m pip install .

      - name: Import CSV files
        shell: bash
        run: |
          shopt -s nullglob

          csv_files=(data/2026/week[0-9][0-9].csv)

          if (( ${#csv_files[@]} == 0 )); then
            echo "No weekly CSV files found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          for csv_file in "${csv_files[@]}"; do
            filename=$(basename "$csv_file")
            week=${filename#week}
            week=${week%.csv}
            week_number=$((10#$week))

            echo "Importing season 2026 week $week_number"

            python scripts/import_picks.py \
              2026 \
              "$week_number"

            echo "Scoring season 2026 week $week_number"

            python scripts/score_week.py \
              2026 \
              "$week_number"

            echo "Aggregating season 2026"

            python scripts/aggregate_season.py \
              2026

            json_file="data/2026/week${week}.json"
            season_file="data/2026/season.json"

            git add "$json_file"
            git add "$season_file"
            git add -u "$csv_file"

            git commit \
              -m "Import week $week_number picks and update scoring"
          done

      - name: Push imported picks
        shell: bash
        run: |
          if git log --format='%an' -1 | grep -q '^github-actions\[bot\]$'; then
            git push
          else
            echo "No import commits to push."
          fi