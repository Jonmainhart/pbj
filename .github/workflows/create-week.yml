name: Create Weekly Schedule

on:
  push:
    branches:
      - feature/github-actions

  schedule:
    # Tuesday at 8:00 AM Eastern during EDT (12:00 UTC).
    - cron: "0 12 * * 2"

  # Allows us to test it manually from GitHub.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-week:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install PBJ
        run: python -m pip install .

      - name: Determine next week
        id: week
        shell: bash
        run: |
          season=2026

          last_week=$(
            find "data/$season" \
              -maxdepth 1 \
              -type f \
              -name 'week[0-9][0-9].json' \
              -printf '%f\n' |
            sort |
            tail -n 1 |
            sed -E 's/week([0-9]{2})\.json/\1/'
          )

          if [[ -z "$last_week" ]]; then
            next_week=1
          else
            next_week=$((10#$last_week + 1))
          fi

          if (( next_week > 18 )); then
            echo "Regular season is complete."
            echo "create=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "week=$next_week" >> "$GITHUB_OUTPUT"
          echo "create=true" >> "$GITHUB_OUTPUT"

          echo "Creating season $season week $next_week"

      - name: Fetch weekly schedule
        if: steps.week.outputs.create == 'true'
        run: |
          python scripts/update_games.py \
            "${{ steps.week.outputs.season }}" \
            "${{ steps.week.outputs.week }}"

      - name: Commit weekly schedule
        if: steps.week.outputs.create == 'true'
        shell: bash
        run: |
          week_file="data/${{ steps.week.outputs.season }}/week$(printf '%02d' '${{ steps.week.outputs.week }}').json"

          git add "$week_file"

          if git diff --cached --quiet; then
            echo "No schedule changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git commit \
            -m "Create week ${{ steps.week.outputs.week }} schedule"

          git push